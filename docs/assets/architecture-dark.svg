<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">trnrt architecture</title>
<desc id="desc">Clients reach a session-affine router on port 8000, which sends each session to one of two engines. Each engine is tensor-parallel over 32 logical NeuronCores on 8 Trainium2 chips and runs a scheduler, a prefix cache with a host-memory tier, and NKI megakernels. Offline, on any x86_64 host, five steps (shapes, decisions, capture, compile, strip) build the compile cache the engines load at start-up.</desc>
<defs><linearGradient id="ra" x1="6" y1="6" x2="38.8354" y2="35.7082" gradientUnits="userSpaceOnUse"><stop stop-color="#FF6900"/><stop offset="1" stop-color="#FB2C36"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff6900" stop-opacity="0.22"/><stop offset="1" stop-color="#ff6900" stop-opacity="0"/></radialGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.07"/></pattern></defs>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffffff" fill-opacity="0.55"/></marker></defs>
