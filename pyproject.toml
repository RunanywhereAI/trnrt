[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trnrt"
dynamic = ["version"]
description = "GLM-5.3-Flash inference on AWS Trainium2, with NKI decode megakernels"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "RunanywhereAI" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy",
  "safetensors",
  "tokenizers",
  "torch>=2.11",
  "transformers>=5.17",
  "jinja2",
  "huggingface_hub",
  "fastapi",
  "uvicorn",
  "httpx",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/RunanywhereAI/trnrt-glm"
Repository = "https://github.com/RunanywhereAI/trnrt-glm"

[project.scripts]
trnrt = "trnrt.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "trnrt.__version__" }

[tool.setuptools.packages.find]
include = ["trnrt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
