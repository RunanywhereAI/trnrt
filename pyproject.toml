[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trnrt"
dynamic = ["version"]
description = "GLM-5.3-Flash inference on AWS Trainium2, with NKI decode megakernels"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy",
  "safetensors",
  "tokenizers",
  "transformers",
  "fastapi",
  "uvicorn",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.dynamic]
version = { attr = "trnrt.__version__" }

[tool.setuptools.packages.find]
include = ["trnrt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
