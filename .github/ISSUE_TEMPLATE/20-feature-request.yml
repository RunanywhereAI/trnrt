name: Feature request
description: A capability trnrt does not have yet
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem it solves
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
