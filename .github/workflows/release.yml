name: Release

# Merging a promotion into main is the release (docs/DEVELOPMENT.md, "Branches and releases"). On every push to main,
# tools/release_plan.py reads trnrt.__version__ and decides: release it (no tag for that version yet, and it is newer
# than every tag), run its publishing again (the tag already points at this commit), or do nothing (the version is not
# bumped, or is not a final X.Y.Z). So a merge into main that does not bump the version publishes nothing.
#
# A release creates the tag vX.Y.Z on the merge commit and a GitHub release with the sdist, the wheel and SHA256SUMS,
# in one job: a tag pushed with the workflow token would not trigger another workflow. Then:
#
# - PyPI: when the repository variable PUBLISH_PYPI is "true", by trusted publishing from the `pypi` environment (which
#   only main may deploy to). An upload that already exists is skipped, so a rerun is safe.
# - Container image (ghcr.io/runanywhereai/trnrt): built and checked on dry runs; built, pushed and attested on a
#   release when the repository variable PUBLISH_IMAGE is "true". The package release never waits on it, and only the
#   publish job holds write permissions.
#
# A dry run (a PR that changes the release machinery, or a manual run) builds and checks everything and publishes
# nothing.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "docker/**"
      - "pyproject.toml"
      - "tools/release_plan.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per commit pushed to main: GitHub keeps a single pending run per group and cancels the older one, which
  # would drop a promotion's release when two arrive while one runs. PRs share their ref's group and cancel superseded runs.
  group: release-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Release plan
    if: github.repository == 'RunanywhereAI/trnrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      action: ${{ steps.plan.outputs.action }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the existing tags
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - id: plan
        run: python tools/release_plan.py --sha "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

  build:
    name: Release package
    needs: plan
    # A push that releases nothing builds nothing; dry runs (PRs, manual) always build.
    if: github.repository == 'RunanywhereAI/trnrt' && (github.event_name != 'push' || needs.plan.outputs.action != 'skip')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install build twine
      - name: Build, with timestamps fixed to the commit's so a rebuild of it gives the same files
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python -m build
      - run: twine check --strict dist/*
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  image:
    name: Release image
    # Dry runs only: builds and checks the image (docker/check_image.py runs inside the build), publishes nothing.
    if: github.repository == 'RunanywhereAI/trnrt' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/runanywhereai/trnrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker/ci_build_image.sh

  image-publish:
    name: Publish image
    needs: [plan, build] # an image is never pushed unless the plan releases this version
    if: github.event_name == 'push' && needs.plan.outputs.action != 'skip' && vars.PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/runanywhereai/trnrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker/ci_build_image.sh
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          docker push "$IMAGE:$VERSION"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          echo "DIGEST=${digest#*@}" >> "$GITHUB_ENV"
      - name: Attest the image's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

  github-release:
    name: GitHub release
    needs: [plan, build]
    if: github.event_name == 'push' && needs.plan.outputs.action != 'skip'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # creates the tag and the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the tag and the release with the sdist, wheel and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # The tag is created here, on the merge commit. A rerun after a later job failed finds the release already
          # there: upload only the files it lacks, never replacing one (PyPI keeps the file it first received, and the
          # checksums must describe the files that were published).
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for f in dist/*; do
              grep -qxF "$(basename "$f")" <<< "$have" || gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
            done
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "TrnRT $TAG" --generate-notes
          fi

  pypi:
    name: PyPI
    needs: [plan, build, github-release] # after the tag exists: an upload to PyPI cannot be taken back
    if: github.event_name == 'push' && needs.plan.outputs.action != 'skip' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Upload only the sdist and wheel
        run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
