name: PR checks

# Advisory checks on every pull request. None is a required check: a failure here asks for a fix, it never blocks a
# merge. Plain `pull_request` with a read-only token, so a fork's PR runs them safely; nothing here needs to write.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: 'The title reads "<area>: <what changes>"'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The squash merge uses the PR title as the commit subject (CONTRIBUTING.md, "Commits and pull requests").
          if printf '%s' "$TITLE" | grep -Eq '^[^[:space:]:][^:]{0,40}: [^[:space:]]'; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title should read '<area>: <what changes>', for example 'router: answer a malformed body with 400'"
            exit 1
          fi

  traced:
    name: Traced code
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: List changed files that the compiled graphs depend on
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The traced paths are the ones the formatter skips (pyproject.toml, [tool.ruff.format] exclude), plus the
          # graph-shape defaults in trnrt/__main__.py (AGENTS.md, invariant 1).
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed.txt
          python3 - <<'PY'
          import fnmatch, os, tomllib
          globs = tomllib.load(open("pyproject.toml", "rb"))["tool"]["ruff"]["format"]["exclude"] + ["trnrt/__main__.py"]
          changed = [line.strip() for line in open("changed.txt") if line.strip()]
          hits = [f for f in changed if any(fnmatch.fnmatch(f, g) for g in globs)]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              if not hits:
                  out.write("No traced code changed: the compiled graphs and compile caches are unaffected.\n")
              else:
                  out.write("### Traced code changed\n\nThese files feed the compiled graphs, so this PR can change "
                            "compile-cache keys:\n\n")
                  out.writelines(f"- `{f}`\n" for f in hits)
                  out.write("\nBefore merge, the PR says which graphs change and shows `tools/graph_equiv.py` "
                            "evidence, or a device run for a new kernel form (CONTRIBUTING.md, rule 1).\n")
          for f in hits:
              print(f"::warning file={f}::Traced code: this change can alter compiled graphs (see the job summary)")
          print(f"{len(hits)} traced file(s) changed")
          PY
