name: Scorecard

# OpenSSF Scorecard: the repository's supply-chain practices, published at scorecard.dev and in the code-scanning tab.

on:
  push:
    branches: [development]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard
    if: github.repository == 'RunanywhereAI/trnrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@52cf1852265d99e9bea071b03366fc777a602909 # v4 (codeql-bundle-v2.27.4)
        with:
          sarif_file: results.sarif
          category: scorecard
