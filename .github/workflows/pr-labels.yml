name: PR labels

# Area labels on every pull request, forks included, by the paths it changes (.github/labeler.yml).
#
# A fork's pull_request run gets a read-only token, and pull_request_target is blocked by default in public
# repositories from 2 December 2026, so labelling runs here, after "PR checks" completes: in this repository's
# context, from the default branch's workflow and label rules. It never checks out or runs the pull request's code.
# The only thing it takes from the pull request's run is its number (an artifact), which it checks is a number and
# names the PR whose head commit triggered this run.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] reads only a PR number, checks it, runs no PR code
    workflows: ["PR checks"]
    types: [completed]

permissions: {}

jobs:
  label:
    name: Label
    # A cancelled run (a newer push superseded it) may have no PR number; the newer run labels the PR.
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # the artifact of the PR checks run
      contents: read # .github/labeler.yml, from the default branch
      pull-requests: write # the labels
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: The PR number, checked against the run that triggered this one
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The artifact comes from a run the pull request controls, so it is only a claim: the PR it names must have
          # the head commit of the run that triggered this one, or another PR could be labelled.
          n=$(tr -d '[:space:]' < pr-number.txt)
          printf '%s' "$n" | grep -Eqx '[0-9]{1,7}' || { echo "::error::not a PR number"; exit 1; }
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n" --jq .head.sha)
          if [ "$head" != "$HEAD_SHA" ]; then
            # A newer push (whose own run labels the PR), or a number that isn't this run's PR: label nothing.
            echo "::notice::PR #$n's head $head is not this run's $HEAD_SHA; not labelling from this run"
            exit 0
          fi
          echo "number=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.number != ''
        with:
          persist-credentials: false
          sparse-checkout: .github/labeler.yml
          sparse-checkout-cone-mode: false
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        if: steps.pr.outputs.number != ''
        with:
          pr-number: ${{ steps.pr.outputs.number }}
          sync-labels: true # an area label comes off when a later push no longer touches it; labels not in the rules stay
